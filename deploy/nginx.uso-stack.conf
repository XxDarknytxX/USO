# =====================================================================
# USO stack — wildcard multi-site vhost (PRODUCTION drop-in).
#
# Apply on the server:
#   cd /var/www/uso-portal && git pull
#   sudo cp /etc/nginx/sites-available/uso-stack /etc/nginx/sites-available/uso-stack.bak.$(date +%s)
#   sudo cp deploy/nginx.uso-stack.conf /etc/nginx/sites-available/uso-stack
#   sudo nginx -t && sudo systemctl reload nginx
#
#   *.vodafonefiji.cloud      → USO Portal (every site; backend resolves by Host)
#   admin.vodafonefiji.cloud  → VV admin   (exact name beats the wildcard)
#   one wildcard cert         → /etc/letsencrypt/live/vodafonefiji.cloud/
# =====================================================================
upstream uso_backend { server 127.0.0.1:5000; keepalive 32; }
upstream vv_backend  { server 127.0.0.1:4001; keepalive 32; }

# ── HTTP → HTTPS for every vodafonefiji.cloud host (+ direct IP) ──
server {
    listen 80;
    listen [::]:80;
    server_name .vodafonefiji.cloud 172.26.70.9 27.123.190.114;
    return 301 https://$host$request_uri;
}

# ── USO Portal — ALL site subdomains via wildcard ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.vodafonefiji.cloud 172.26.70.9 27.123.190.114;

    root /var/www/uso-portal/uso-portal/frontend/build;
    index index.html;

    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    client_max_body_size 2m;

    location /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ ^/(api|payment)/ {
        proxy_pass         http://uso_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    location / { try_files $uri $uri/ /index.html; }

    gzip on; gzip_vary on; gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    ssl_certificate     /etc/letsencrypt/live/vodafonefiji.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vodafonefiji.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ── Admin dashboard (exact name beats the wildcard above) ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.vodafonefiji.cloud;

    root /var/www/uso-portal/voucher-validation/frontend/build;
    index index.html;

    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    client_max_body_size 5m;

    location /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass         http://vv_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    location / { try_files $uri $uri/ /index.html; }

    gzip on; gzip_vary on; gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    ssl_certificate     /etc/letsencrypt/live/vodafonefiji.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vodafonefiji.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ── Port 8080 — LAN-only admin fallback (unchanged) ──
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /var/www/uso-portal/voucher-validation/frontend/build;
    index index.html;

    location /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass         http://vv_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location / { try_files $uri $uri/ /index.html; }
}
